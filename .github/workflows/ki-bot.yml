# KI-Bot: arbeitet offene Issues mit Label «ki-bot» ab, jedes als eigener PR im Ziel-Repo.
# Ein Issue nennt sein Ziel-Repo in einer Zeile «Repo: ChrisKoller35/<name>».
# Regeln (von Christoph am 15.10.2026 freigegeben): nur Repos aus ERLAUBTE_REPOS, immer PR,
# nie mergen, nie auf main pushen, SpellManager nie, Tagesbudget mit Übertrag (scripts/budget.py).
name: KI-Bot

on:
  schedule:
    # GitHub rechnet in UTC. Damit der Bot das ganze Jahr um 23:00 und 03:00 Schweizer Zeit läuft,
    # stehen beide Zeiten doppelt da (Sommer- und Winterzeit); der Job «uhrzeit» lässt nur die passende arbeiten.
    - cron: "0 21 * * *" # 23:00 Sommerzeit
    - cron: "0 22 * * *" # 23:00 Winterzeit
    - cron: "0 1 * * *" # 03:00 Sommerzeit
    - cron: "0 2 * * *" # 03:00 Winterzeit
  workflow_dispatch:

jobs:
  uhrzeit:
    runs-on: ubuntu-latest
    outputs:
      laufen: ${{ steps.pruefen.outputs.laufen }}
    steps:
      - id: pruefen
        env:
          PLAN: ${{ github.event.schedule }}
        run: |
          # Von Hand gestartet: immer laufen. Sonst zählt die geplante Stunde in Schweizer Zeit, nicht der
          # Startzeitpunkt (GitHub startet oft verspätet).
          if [ -z "$PLAN" ]; then echo "laufen=ja" >> "$GITHUB_OUTPUT"; exit 0; fi
          stunde_utc=$(awk '{print $2}' <<<"$PLAN")
          stunde_ch=$(TZ=Europe/Zurich date -d "$(date -u +%F) ${stunde_utc}:00 UTC" +%H)
          case "$stunde_ch" in
            23|03) echo "laufen=ja" >> "$GITHUB_OUTPUT" ;;
            *) echo "laufen=nein" >> "$GITHUB_OUTPUT"; echo "Plan «$PLAN» ist ${stunde_ch}:00 Schweizer Zeit, nicht dran." ;;
          esac

  arbeiten:
    needs: uhrzeit
    if: needs.uhrzeit.outputs.laufen == 'ja'
    # Nie zwei Läufe gleichzeitig (nur echte Läufe; die übersprungenen Zeiten kommen gar nicht hierher).
    concurrency: ki-bot
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAX_AUFGABEN: 5
      # Nur diese Repos darf der Bot anfassen. Neue Repos erst nach Christophs Freigabe eintragen.
      ERLAUBTE_REPOS: "chriskoller35/trailmate chriskoller35/lowland chriskoller35/moneyprojekttry chriskoller35/ideenkarte chriskoller35/aufbauspiel-new" # klein geschrieben
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Claude Code installieren
        run: npm install -g @anthropic-ai/claude-code

      - name: Aufgaben abarbeiten
        run: |
          git config --global user.name "ki-bot"
          git config --global user.email "ki-bot@users.noreply.github.com"
          erledigt=" "
          for i in $(seq 1 "$MAX_AUFGABEN"); do
            frei=$(python3 scripts/budget.py frei)
            echo "Frei heute: $frei USD"
            if awk "BEGIN{exit !($frei < 1)}"; then echo "Tagesbudget erreicht."; break; fi

            # REST statt «gh issue list»: die Suche hinkt nach und lieferte dasselbe Issue zweimal.
            issue=$(gh api "repos/${GITHUB_REPOSITORY}/issues?labels=ki-bot&state=open&sort=created&direction=asc&per_page=50" \
                     --jq "[.[] | select(.pull_request == null) | select(\" \(.number) \" | inside(\"${erledigt}\") | not)] | .[0] // empty")
            [ -z "$issue" ] && { echo "Keine offenen Aufgaben."; break; }
            nr=$(jq -r .number <<<"$issue")
            erledigt="${erledigt}${nr} "
            titel=$(jq -r .title <<<"$issue")
            text=$(jq -r .body <<<"$issue")
            repo=$(grep -oP '^Repo:\s*\K\S+' <<<"$text" | head -1 || true)
            repo_klein=$(tr '[:upper:]' '[:lower:]' <<<"$repo")

            if [ -z "$repo" ] || [[ " $ERLAUBTE_REPOS " != *" $repo_klein "* ]]; then
              gh issue comment "$nr" -R "$GITHUB_REPOSITORY" \
                --body "Übersprungen: Ziel-Repo «$repo» ist nicht freigegeben. Bitte im Projekt klären."
              gh issue edit "$nr" -R "$GITHUB_REPOSITORY" --remove-label ki-bot --add-label für-projekt
              continue
            fi

            rm -rf work
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" work
            branch="ki-bot/issue-${nr}"
            git -C work checkout -b "$branch"
            basis=$(git -C work rev-parse HEAD)

            printf '%s\n' \
              "Du arbeitest an genau dieser Aufgabe im Repo ${repo}:" \
              "Titel: ${titel}" "" "${text}" "" \
              "Regeln: Lies zuerst CLAUDE.md bzw. README. Bleib bei dieser Aufgabe." \
              "Führe vorhandene Tests und Checks aus. Committe auf dem aktuellen Branch nach jedem fertigen Teilschritt (nicht erst am Schluss), pushe nicht." \
              "Schreib am Ende eine kurze deutsche Zusammenfassung: was gemacht, was geprüft, was offen ist." \
              > auftrag.txt

            # Eingeschränkte Werkzeuge statt freier Shell: Dateien bearbeiten, npm-Skripte, git add/commit.
            (cd work && claude -p "$(cat ../auftrag.txt)" --output-format json --max-turns 90 \
                --model claude-opus-5-5 --permission-mode acceptEdits \
                --allowedTools "Read" "Edit" "Write" "Glob" "Grep" \
                  "Bash(npm install:*)" "Bash(npm ci:*)" "Bash(npx jest:*)" "Bash(npx expo lint:*)" "Bash(npm test:*)" "Bash(npm run:*)" "Bash(npx tsc:*)" \
                  "Bash(git status)" "Bash(git diff:*)" "Bash(git add:*)" "Bash(git commit:*)" "Bash(git log:*)" \
            ) > ergebnis.json || true
            kosten=$(jq -r '.total_cost_usd // 0' ergebnis.json 2>/dev/null || echo 0)
            zusammenfassung=$(jq -r '.result // "Keine Zusammenfassung."' ergebnis.json 2>/dev/null || echo "Lauf fehlgeschlagen.")
            python3 scripts/budget.py buchen "$kosten" "issue #${nr} ${repo}"

            if [ "$(git -C work rev-parse HEAD)" != "$basis" ]; then
              if ! git -C work push -u origin "$branch"; then
                gh issue comment "$nr" -R "$GITHUB_REPOSITORY" --body "Push fehlgeschlagen, bitte im Projekt prüfen."
                gh issue edit "$nr" -R "$GITHUB_REPOSITORY" --remove-label ki-bot --add-label für-projekt
                continue
              fi
              pr=$(cd work && gh pr create -R "$repo" --head "$branch" --title "$titel" \
                    --body "$(printf 'Aufgabe: %s#%s\n\n%s\n\nKosten: %s USD\n\nGeprüft und gemergt wird von einem Thread im Projekt Manager Claude (Regel seit 18.10.2026).' \
                              "$GITHUB_REPOSITORY" "$nr" "$zusammenfassung" "$kosten")")
              gh issue comment "$nr" -R "$GITHUB_REPOSITORY" --body "PR: $pr (Kosten ${kosten} USD)"
              gh issue edit "$nr" -R "$GITHUB_REPOSITORY" --remove-label ki-bot --add-label in-review
            else
              gh issue comment "$nr" -R "$GITHUB_REPOSITORY" \
                --body "$(printf 'Keine Änderungen entstanden (Kosten %s USD).\n\n%s' "$kosten" "$zusammenfassung")"
              gh issue edit "$nr" -R "$GITHUB_REPOSITORY" --remove-label ki-bot --add-label für-projekt
            fi
          done
          python3 scripts/budget.py stand

      - name: Budget sichern
        if: always()
        run: |
          git add budget.json
          git diff --cached --quiet && exit 0
          git commit -m "Budget nachführen"
          # main kann sich während des Laufs ändern (Manager, Threads): vor dem Push neu holen.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
